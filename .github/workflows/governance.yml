name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate PR Commits
        run: |
          npx --yes -p @commitlint/cli -p @commitlint/config-conventional \
            commitlint --from=${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to=${{ github.event.pull_request.head.sha || 'HEAD' }} --verbose

  lint:
    name: Code & Config Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
